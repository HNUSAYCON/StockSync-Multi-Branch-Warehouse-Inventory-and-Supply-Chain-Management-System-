<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockSync | Warehouse Staff</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initPage } from './js/layout.js';
    import { renderDashboard } from './js/sections/dashboard.js';
    import { renderStock } from './js/sections/stock.js';
    import { renderPurchaseOrders } from './js/sections/purchaseOrders.js';
    import { renderTransfers } from './js/sections/transfers.js';
    import { renderAdjustments } from './js/sections/adjustments.js';
    import { renderMovements } from './js/sections/movements.js';

    initPage({
      allowedRoles: ['staff'],
      title: 'Warehouse Staff',
      sections: [
        { id: 'dashboard',   label: 'My warehouse',    icon: 'speedometer2',    render: renderDashboard },
        { id: 'stock',       label: 'Stock levels',    icon: 'box-seam',        render: renderStock },
        { id: 'orders',      label: 'Receive deliveries', icon: 'box-arrow-in-down', render: renderPurchaseOrders },
        { id: 'transfers',   label: 'Transfers',       icon: 'truck',           render: renderTransfers },
        { id: 'adjustments', label: 'My adjustments',  icon: 'clipboard-check', render: renderAdjustments },
        { id: 'movements',   label: 'My history',      icon: 'clock-history',   render: renderMovements },
      ],
    });
  </script>
</body>
</html>
