<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockSync | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-scene" id="scene"></div>

  <main class="login-layout">
    <section class="login-intro">
      <div class="brand-mark"><i class="bi bi-boxes"></i> StockSync</div>
      <h1>Every branch's stock, in one place.</h1>
      <p>Track deliveries, transfers, and adjustments across all your warehouses, with every change recorded.</p>
    </section>

    <div class="login-card">
      <h2>Log in</h2>
      <p class="text-muted small mb-4">Use the account your administrator gave you.</p>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input id="email" type="email" class="form-control form-control-lg" autocomplete="username" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input id="password" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
        </div>
        <button id="loginBtn" class="btn btn-primary btn-lg w-100" type="submit">
          <span class="spinner-border spinner-border-sm me-1 d-none" id="loginSpin"></span>Log in
        </button>
        <div id="error" class="alert alert-danger small mt-3 mb-0 d-none"></div>
      </form>
    </div>
  </main>

  <script type="module">
    import { login, getMyProfile } from './js/api.js';
    import { friendlyError } from './js/ui.js';
    import { warehouseScene } from './js/art.js';

    document.getElementById('scene').innerHTML = warehouseScene();

    // Already logged in? Go straight to the right dashboard.
    getMyProfile().then((me) => {
      if (me?.is_active) location.replace(`${me.role}.html`);
    }).catch(() => {});

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('d-none');
      if (!form.checkValidity()) { form.classList.add('was-validated'); return; }

      const button = document.getElementById('loginBtn');
      button.disabled = true;
      document.getElementById('loginSpin').classList.remove('d-none');
      try {
        const me = await login(document.getElementById('email').value.trim(), document.getElementById('password').value);
        location.replace(`${me.role}.html`);   // admin.html, manager.html, or staff.html
      } catch (err) {
        errorBox.textContent = friendlyError(err.message);
        errorBox.classList.remove('d-none');
        button.disabled = false;
        document.getElementById('loginSpin').classList.add('d-none');
      }
    });
  </script>
</body>
</html>
