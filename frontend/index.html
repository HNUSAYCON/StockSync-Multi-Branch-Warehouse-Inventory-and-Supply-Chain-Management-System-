<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StockSync | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 700px;">
    <div class="card shadow-sm p-4 mb-4">
      <h3 class="mb-3 text-center">StockSync</h3>
      <input id="email" type="email" class="form-control mb-2" placeholder="Email">
      <input id="password" type="password" class="form-control mb-3" placeholder="Password">
      <button id="loginBtn" class="btn btn-primary w-100">Log in</button>
      <div id="error" class="text-danger mt-2 small"></div>
    </div>
    <div id="output"></div>
  </div>

  <script type="module">
    import { login, logout, getDashboard } from './js/api.js';

    document.getElementById('loginBtn').addEventListener('click', async () => {
      document.getElementById('error').textContent = '';
      try {
        await logout();  // clear any previous login
        const me = await login(
          document.getElementById('email').value,
          document.getElementById('password').value);

        const warehouses = await getDashboard();
        document.getElementById('output').innerHTML = `
          <div class="alert alert-success">Logged in as <b>${me.email}</b> (role: <b>${me.role}</b>)</div>
          <table class="table table-bordered bg-white">
            <tr><th>Warehouse</th><th>Low stock</th><th>Stock value</th><th>Pending adjustments</th></tr>
            ${warehouses.map(w => `
              <tr><td>${w.warehouse_name}</td><td>${w.low_stock_items}</td>
                  <td>₱${Number(w.stock_value).toLocaleString()}</td><td>${w.pending_adjustments}</td></tr>`).join('')}
          </table>`;
      } catch (err) {
        document.getElementById('error').textContent = err.message;
      }
    });
  </script>
</body>
</html>
