<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockSync | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card shadow-lg">
      <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
          <div class="login-logo mb-3"><i class="bi bi-boxes"></i></div>
          <h3 class="fw-bold mb-1">StockSync</h3>
          <p class="text-muted small mb-0">Multi-Branch Warehouse Inventory &amp; Supply Chain</p>
        </div>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="email">Email</label>
            <input id="email" type="email" class="form-control" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="password">Password</label>
            <input id="password" type="password" class="form-control" autocomplete="current-password" required>
          </div>
          <button id="loginBtn" class="btn btn-primary w-100" type="submit">
            <span class="spinner-border spinner-border-sm me-1 d-none" id="loginSpin"></span>Log in
          </button>
          <div id="error" class="alert alert-danger small mt-3 mb-0 d-none"></div>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { login, getMyProfile } from './js/api.js';
    import { friendlyError } from './js/ui.js';

    // Already logged in? Go straight to the right dashboard.
    getMyProfile().then((me) => {
      if (me?.is_active) location.replace(`${me.role}.html`);
    }).catch(() => {});

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('d-none');
      if (!form.checkValidity()) { form.classList.add('was-validated'); return; }

      const button = document.getElementById('loginBtn');
      button.disabled = true;
      document.getElementById('loginSpin').classList.remove('d-none');
      try {
        const me = await login(document.getElementById('email').value.trim(), document.getElementById('password').value);
        location.replace(`${me.role}.html`);   // admin.html, manager.html, or staff.html
      } catch (err) {
        errorBox.textContent = friendlyError(err.message);
        errorBox.classList.remove('d-none');
        button.disabled = false;
        document.getElementById('loginSpin').classList.add('d-none');
      }
    });
  </script>
</body>
</html>
